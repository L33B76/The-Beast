# TODO: sustituir por los hosts reales. Los grupos son los que usa el runbook.
all:
  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_SSH_USER') | default('opc', true) }}"
    oracle_home: /u01/app/oracle/product/19.0.0/dbhome_1     # TODO
    oracle_sid: AMAPRO                                         # TODO
    oracle_os_user: oracle
    # Esquemas de aplicación cuyas sesiones se matan en el switchover (TODO)
    app_schemas: [AMA_APP, AMA_BATCH]
    # Comandos de arranque en los servidores de aplicación (TODO: rutas reales)
    wl_start_cmd: /u01/scripts/start_weblogic.sh
    forms_restart_cmd: /u01/scripts/restart_forms.sh
  children:
    oracle_primary:
      hosts:
        ora-prod-01: {ansible_host: 10.0.0.10}
    oracle_dr:
      hosts:
        ora-dr-01: {ansible_host: 10.1.0.10}
    weblogic:
      hosts:
        wl-dr-01: {ansible_host: 10.1.0.20}
        wl-dr-02: {ansible_host: 10.1.0.21}
    forms:
      hosts:
        forms-dr-01: {ansible_host: 10.1.0.30}
        forms-dr-02: {ansible_host: 10.1.0.31}
